name: 機能要望
description: 新機能や改善のアイデア
title: "[要望] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景・課題
      description: どんな場面で困っているか
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望する解決策（あれば）
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案（あれば）
    validations:
      required: false
