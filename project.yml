name: Kintore
options:
  bundleIdPrefix: com.kintore
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.3"
  generateEmptyDirectories: true
# CLI / CI でシミュレータ名を指定しなくてもビルドできるよう、メインアプリのスキームを明示する
schemes:
  Kintore:
    build:
      targets:
        Kintore: all
    run:
      config: Debug
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Kintore:
    type: application
    platform: iOS
    sources:
      - path: Kintore
        excludes:
          - "**/*.md"
    settings:
      base:
        INFOPLIST_GENERATION_MODE: GeneratedByXcode
        PRODUCT_BUNDLE_IDENTIFIER: com.kintore.app
        PRODUCT_NAME: Kintore
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_CFBundleDisplayName: "Kintore"
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Saves completed workouts to Apple Health when you enable the option in Settings."
        CODE_SIGN_ENTITLEMENTS: Kintore/Kintore.entitlements
    dependencies:
      - target: KintoreWatch
        embed: true
      - target: KintoreWidget
        embed: true
  KintoreWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: KintoreWatch
    resources:
      - path: KintoreWatch/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kintore.app.watchkitapp
        PRODUCT_NAME: Kintore Watch
        INFOPLIST_GENERATION_MODE: GeneratedByXcode
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "RepLog"
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.kintore.app
  KintoreWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KintoreWidget
        excludes:
          - "**/*.md"
    resources:
      - path: KintoreWidget/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kintore.app.widget
        PRODUCT_NAME: KintoreWidget
        INFOPLIST_FILE: KintoreWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: KintoreWidget/KintoreWidget.entitlements
