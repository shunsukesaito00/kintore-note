name: Kintore
# 開発チーム ID は project.local.yml の DEVELOPMENT_TEAM に記載（例: project.local.yml.example）
include:
  - project.local.yml
options:
  bundleIdPrefix: com.shunsukesaito
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.3"
  generateEmptyDirectories: true

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 13.0.0

# CLI / CI でシミュレータ名を指定しなくてもビルドできるよう、メインアプリのスキームを明示する
# Kintore-Screenshots: App Store Connect 審査用キャプチャ（IAP が ¥300 と表示される StoreKit テスト構成）
schemes:
  Kintore:
    build:
      targets:
        Kintore: all
    run:
      config: Debug
  Kintore-Screenshots:
    build:
      targets:
        Kintore: all
    run:
      config: Debug
      storeKitConfiguration: Kintore/PremiumScreenshots.storekit
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Kintore:
    type: application
    platform: iOS
    sources:
      - path: Kintore
        excludes:
          - "**/*.md"
          - PremiumScreenshots.storekit
      # スキームの StoreKit テスト用（バンドルには含めない）
      - path: Kintore/PremiumScreenshots.storekit
        buildPhase: none
    settings:
      base:
        INFOPLIST_GENERATION_MODE: GeneratedByXcode
        INFOPLIST_FILE: Kintore/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.shunsukesaito.kintore
        PRODUCT_NAME: Kintore
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "らくらく筋トレ記録"
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Saves completed workouts to Apple Health when you enable the option in Settings."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Reads workout-related data from Apple Health only when you enable features that require it in Settings."
        INFOPLIST_KEY_GADApplicationIdentifier: "ca-app-pub-3293510133025826~2839942057"
        CODE_SIGN_ENTITLEMENTS: Kintore/Kintore.entitlements
    dependencies:
      # Apple Watch アプリは App Store 提出を一時停止（Watch 用スクリーンショット未準備のため）。再有効化時は KintoreWatch ターゲットを復元し embed する。
      - target: KintoreWidget
        embed: true
      - package: GoogleMobileAds
        products:
          - GoogleMobileAds
    postbuildScripts:
      - path: scripts/copy_spm_framework_dsyms.sh
        name: Copy SPM framework dSYMs
  # KintoreWatch: 一時的にターゲットから外しています。ソースは KintoreWatch/ に残置。再有効化は project.yml に KintoreWatch ターゲットと Kintore の embed 依存を追加。
  KintoreWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: KintoreWidget
        excludes:
          - "**/*.md"
    resources:
      - path: KintoreWidget/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shunsukesaito.kintore.widget
        PRODUCT_NAME: KintoreWidget
        INFOPLIST_FILE: KintoreWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: KintoreWidget/KintoreWidget.entitlements
